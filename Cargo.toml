[package]
name = "youtube-multiroom"
version = "1.7.2"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
hmac = "0.13"
libc = "0.2.189"
openssl = "0.10.81"
redis = { version = "1.5.0", features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
rust-i18n = "4.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[lints.clippy]
# No request may be able to take the process down. Nothing outside the tests
# unwraps today; denying it is what keeps that true as the code grows, and the
# `check` workflow runs clippy with -D warnings so it is enforced on every push.
# Tests are exempt via clippy.toml — there, a panic is how a failure is reported.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
